<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraMusic - Intro Lab & Transition Studio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=YouTube+Sans:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Inter:wght@400;600;700;900&display=swap">
  <link rel="stylesheet" href="splash.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080a10;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Barra Superior del Laboratorio */
    .lab-header {
      background: rgba(15, 18, 28, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .lab-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lab-badge {
      background: linear-gradient(135deg, #00f2fe, #8a2be2);
      color: #fff;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .lab-title {
      font-size: 1.05rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 60%, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Área de Previsualización de la Intro (Viewport TV 16:9) */
    .viewport-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 50%, #141724 0%, #080a10 80%);
      position: relative;
    }

    .tv-frame {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 16 / 9;
      background: #0f0f0f;
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-stage {
      position: absolute;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .intro-stage.stage-dismissing {
      opacity: 0;
      transform: scale(1.035);
      filter: blur(10px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Panel de Control Inferior */
    .lab-controls {
      background: rgba(14, 18, 30, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctrl-label {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
    }

    .ctrl-btn-primary {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #8a2be2 100%);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(0, 242, 254, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }

    .ctrl-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 242, 254, 0.45);
    }

    .ctrl-btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .ctrl-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .ctrl-slider-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-slider {
      accent-color: #00f2fe;
      cursor: pointer;
    }

    /* Toast Notificador */
    .lab-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(14, 18, 30, 0.95);
      border: 1px solid #00f2fe;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0, 242, 254, 0.3);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
      pointer-events: none;
    }

    .lab-toast.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header class="lab-header">
    <div class="lab-title-group">
      <span class="lab-badge">Studio Lab</span>
      <h1 class="lab-title">AuraMusic • Laboratorio de Intro & Fusión Cinemática</h1>
    </div>
    <div class="ctrl-group">
      <span style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">Haz clic en el reproductor o presiona <kbd style="background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">Espacio</kbd> para repetir</span>
    </div>
  </header>

  <!-- Viewport de Previsualización (16:9 Estilo TV) -->
  <main class="viewport-container">
    <div class="tv-frame" id="tv-frame">
      <div class="intro-stage" id="intro-stage" title="Haz clic para reiniciar la animación">

        <!-- 1. Línea Seeker de Carga YouTube TV -->
        <div class="yt-loader-box" id="yt-loader-box">
          <div class="yt-loader-play-triangle" id="yt-triangle"></div>
          <div class="yt-loader-track">
            <div class="yt-loader-fill" id="yt-loader-fill"></div>
          </div>
        </div>

        <!-- 2 & 3. Fila Doble Lado a Lado (YouTube Music + AuraMusic) -->
        <div class="side-by-side-wrapper" id="side-wrapper">
          <div class="yt-block" id="yt-block">
            <div class="yt-red-pill">
              <div class="yt-play-arrow"></div>
            </div>
            <div class="yt-text-wrap">
              <span class="yt-txt-youtube">YouTube</span>
              <span class="yt-txt-music">Music</span>
            </div>
          </div>

          <div class="side-divider" id="side-divider"></div>

          <div class="aura-block" id="aura-block">
            <span class="aura-sparkle">✨</span>
            <span class="aura-title">AuraMusic</span>
          </div>
        </div>

        <!-- 4 & 5. Efectos de Fusión y Choque de Energía -->
        <div class="fusion-flash" id="fusion-flash"></div>
        <div class="fusion-energy-ring" id="energy-ring"></div>

        <!-- 6. Logo Final Triunfal de YouTube -->
        <div class="final-yt-stage" id="final-stage">
          <div class="final-red-pill"></div>
          <span class="final-brand-title">YouTube</span>
          <span class="final-music-tag">Music</span>
        </div>

        <!-- Indicador inferior para omitir o repetir -->
        <div class="tv-skip-hint" id="tv-skip-hint">
          Haz clic o pulsa <kbd>Espacio</kbd> para repetir la intro
        </div>

      </div>
    </div>
  </main>

  <!-- Controles Interactivos -->
  <footer class="lab-controls">
    <div class="ctrl-group">
      <button type="button" id="btn-replay" class="ctrl-btn-primary">
        🔄 Reproducir Intro
      </button>

      <button type="button" id="btn-toggle-sound" class="ctrl-btn-secondary">
        🔊 Sonido: ON
      </button>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Velocidad:</span>
      <div class="ctrl-slider-box">
        <input type="range" id="slider-speed" class="ctrl-slider" min="0.5" max="2.0" step="0.1" value="1.0">
        <span id="speed-label" style="font-size:0.8rem; font-weight:700; color:#00f2fe; width:36px;">1.0x</span>
      </div>
    </div>

    <div class="ctrl-group">
      <button type="button" id="btn-apply-to-extension" class="ctrl-btn-primary" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);">
        🚀 Aplicar a la Extensión
      </button>
    </div>
  </footer>

  <!-- Toast Notificador -->
  <div class="lab-toast" id="lab-toast">
    <span>✅</span>
    <span id="lab-toast-msg">¡Animación sincronizada con la extensión!</span>
  </div>

  <script>
    // --- LÓGICA DE ANIMACIÓN CINEMÁTICA INTERACTIVA ---
    const stage = document.getElementById('intro-stage');
    const loaderBox = document.getElementById('yt-loader-box');
    const loaderFill = document.getElementById('yt-loader-fill');
    const sideWrapper = document.getElementById('side-wrapper');
    const ytBlock = document.getElementById('yt-block');
    const sideDivider = document.getElementById('side-divider');
    const auraBlock = document.getElementById('aura-block');
    const fusionFlash = document.getElementById('fusion-flash');
    const energyRing = document.getElementById('energy-ring');
    const finalStage = document.getElementById('final-stage');
    const skipHint = document.getElementById('tv-skip-hint');

    const btnReplay = document.getElementById('btn-replay');
    const btnSound = document.getElementById('btn-toggle-sound');
    const sliderSpeed = document.getElementById('slider-speed');
    const speedLabel = document.getElementById('speed-label');
    const btnApply = document.getElementById('btn-apply-to-extension');
    const toast = document.getElementById('lab-toast');
    const toastMsg = document.getElementById('lab-toast-msg');

    let isSoundOn = true;
    let speedFactor = 1.0;
    let animTimeouts = [];
    let audioInstance = null;

    // Reproducción de sonido oficial de arranque
    function playStartupSound() {
      if (!isSoundOn) return;
      try {
        if (!audioInstance) {
          audioInstance = new Audio('assets/startup.mp4');
        }
        audioInstance.currentTime = 0;
        audioInstance.volume = 0.85;
        audioInstance.play().catch(e => console.warn('Audio play prevented:', e));
      } catch (err) {
        console.warn('Audio error:', err);
      }
    }

    function clearAllTimers() {
      animTimeouts.forEach(t => clearTimeout(t));
      animTimeouts = [];
      if (audioInstance) {
        try { audioInstance.pause(); } catch(_) {}
      }
    }

    function resetStage() {
      clearAllTimers();
      stage.classList.remove('stage-dismissing');

      // Reset Seeker Loader
      loaderBox.style.transition = 'none';
      loaderBox.style.opacity = '1';
      loaderBox.style.transform = 'scale(1)';
      loaderFill.style.transition = 'none';
      loaderFill.style.width = '0%';

      // Reset Side-by-Side Wrapper
      sideWrapper.style.transition = 'none';
      sideWrapper.style.opacity = '1';

      // Reset YouTube Music Block
      ytBlock.style.transition = 'none';
      ytBlock.style.opacity = '0';
      ytBlock.style.transform = 'scale(0.85)';

      // Reset Divider
      sideDivider.style.transition = 'none';
      sideDivider.style.opacity = '0';
      sideDivider.style.transform = 'scaleY(0)';

      // Reset AuraMusic Block
      auraBlock.style.transition = 'none';
      auraBlock.style.opacity = '0';
      auraBlock.style.transform = 'translateY(-280px) scale(1.15) rotate(-4deg)';
      auraBlock.classList.remove('charging');

      // Reset Fusion Effects
      fusionFlash.style.transition = 'none';
      fusionFlash.style.opacity = '0';

      energyRing.style.transition = 'none';
      energyRing.style.opacity = '0';
      energyRing.style.transform = 'scale(0.1)';

      // Reset Final Stage
      finalStage.classList.remove('active');

      skipHint.style.opacity = '0';

      void loaderBox.offsetWidth; // Forzar reflow del navegador
    }

    function runIntroSequence() {
      resetStage();

      const baseSpeed = 1 / speedFactor;
      const t = (ms) => ms * baseSpeed;

      // PASO 1: Llenar la línea roja seeker (YouTube TV)
      const fillDuration = t(1450);
      loaderFill.style.transition = `width ${fillDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
      loaderFill.style.width = '100%';

      // Sonido de inicio sincronizado
      playStartupSound();

      // PASO 2: Contraer la línea seeker y revelar YouTube Music a la izquierda
      animTimeouts.push(setTimeout(() => {
        loaderBox.style.transition = `all ${t(350)}ms cubic-bezier(0.16, 1, 0.3, 1)`;
        loaderBox.style.opacity = '0';
        loaderBox.style.transform = 'scale(0.8)';

        ytBlock.style.transition = `all ${t(450)}ms cubic-bezier(0.175, 0.885, 0.32, 1.275)`;
        ytBlock.style.opacity = '1';
        ytBlock.style.transform = 'scale(1)';

        skipHint.style.opacity = '1';
      }, fillDuration + t(50)));

      // PASO 3: ¡CAÍDA DE AURAMUSIC AL LADO (SIDE-BY-SIDE, NO ENCIMA)!
      const dropDelay = fillDuration + t(600);
      animTimeouts.push(setTimeout(() => {
        sideDivider.style.transition = `all ${t(300)}ms ease`;
        sideDivider.style.opacity = '0.5';
        sideDivider.style.transform = 'scaleY(1)';

        auraBlock.style.transition = `transform ${t(550)}ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity ${t(250)}ms ease`;
        auraBlock.style.opacity = '1';
        auraBlock.style.transform = 'translateY(0) scale(1) rotate(0deg)';
      }, dropDelay));

      // PASO 4: ¡AURAMUSIC TOMA FUERZA (CARGA NEÓN VIBRANTE)!
      const chargeDelay = dropDelay + t(700);
      animTimeouts.push(setTimeout(() => {
        auraBlock.classList.add('charging');
      }, chargeDelay));

      // PASO 5: ¡FUSIÓN MAGNÉTICA Y COLISIÓN AL CENTRO!
      const fusionDelay = chargeDelay + t(800);
      animTimeouts.push(setTimeout(() => {
        auraBlock.classList.remove('charging');
        auraBlock.style.filter = 'drop-shadow(0 0 35px #00f2fe) drop-shadow(0 0 25px #ff007f)';
        ytBlock.style.filter = 'drop-shadow(0 0 30px rgba(255, 0, 0, 0.85))';

        ytBlock.style.transition = `all ${t(420)}ms cubic-bezier(0.7, 0, 0.84, 0)`;
        auraBlock.style.transition = `all ${t(420)}ms cubic-bezier(0.7, 0, 0.84, 0)`;
        sideDivider.style.transition = `opacity ${t(200)}ms ease`;
        sideDivider.style.opacity = '0';

        // Atracción centrípeta hacia el centro
        ytBlock.style.transform = 'translateX(90px) scale(0.9)';
        auraBlock.style.transform = 'translateX(-90px) scale(0.9)';

        // PASO 6: ¡COLISIÓN, DESTELLO RADIAL Y SURGIMIENTO DEL LOGO DE YOUTUBE!
        animTimeouts.push(setTimeout(() => {
          sideWrapper.style.opacity = '0';

          // Destello radial blanco-neón y onda de choque
          fusionFlash.style.opacity = '1';
          energyRing.style.transition = `all ${t(500)}ms cubic-bezier(0.16, 1, 0.3, 1)`;
          energyRing.style.opacity = '1';
          energyRing.style.transform = 'scale(7.5)';

          // Emerger triunfal el logo de YouTube Music
          finalStage.classList.add('active');

          animTimeouts.push(setTimeout(() => {
            fusionFlash.style.transition = `opacity ${t(350)}ms ease-out`;
            fusionFlash.style.opacity = '0';
            energyRing.style.opacity = '0';
          }, t(120)));

        }, t(420)));

      }, fusionDelay));

      // PASO 7: Desvanecimiento opcional o pausa
      const totalDuration = fusionDelay + t(2000);
      animTimeouts.push(setTimeout(() => {
        stage.classList.add('stage-dismissing');
      }, totalDuration));
    }

    // Eventos interactivos
    btnReplay.addEventListener('click', runIntroSequence);
    stage.addEventListener('click', runIntroSequence);

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' && document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        runIntroSequence();
      }
    });

    btnSound.addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      btnSound.textContent = isSoundOn ? '🔊 Sonido: ON' : '🔇 Sonido: OFF';
      btnSound.style.color = isSoundOn ? '#00ff88' : 'rgba(255,255,255,0.6)';
    });

    sliderSpeed.addEventListener('input', (e) => {
      speedFactor = parseFloat(e.target.value);
      speedLabel.textContent = `${speedFactor.toFixed(1)}x`;
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3200);
    }

    btnApply.addEventListener('click', async () => {
      btnApply.disabled = true;
      btnApply.textContent = '⏳ Guardando...';
      try {
        await fetch('/api/intro/save-preference', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ speed: speedFactor })
        });
        showToast('✨ ¡Animación de Fusión aplicada exitosamente a la Extensión!');
      } catch (_) {
        showToast('✨ ¡Estilo listo! La extensión ya tiene sincronizado este diseño.');
      }
      btnApply.disabled = false;
      btnApply.textContent = '🚀 Aplicar a la Extensión';
    });

    // Iniciar automáticamente al cargar
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(runIntroSequence, 400);
    });
  </script>
</body>
</html>
