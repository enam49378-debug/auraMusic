<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraMusic</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="title-row">
        <span class="logo">✨</span>
        <h1 class="title">AuraMusic</h1>
      </div>
      <span class="badge">v1.0</span>
    </header>

    <div class="quick-status">
      <span class="status-indicator active"></span>
      <span class="status-text">YouTube Music Mejorado</span>
    </div>

    <section class="section">
      <label class="section-title">Tema Rápido</label>
      <div class="theme-buttons">
        <button type="button" class="theme-btn" data-theme="oled">OLED</button>
        <button type="button" class="theme-btn" data-theme="cyberpunk">Cyber</button>
        <button type="button" class="theme-btn" data-theme="glass">Glass</button>
        <button type="button" class="theme-btn" data-theme="dynamic">Color</button>
      </div>
    </section>

    <footer class="popup-footer">
      <a href="https://music.youtube.com" target="_blank" class="ytm-link-btn">Abrir YouTube Music 🎵</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
